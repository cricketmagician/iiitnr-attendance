services:
  - type: web
    name: iiitnr-attendance
    runtime: python
    rootDir: backend
    buildCommand: "./download_models.sh && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      # WARNING: /tmp is wiped on every restart/redeploy. Point this at a managed
      # Postgres (postgresql+psycopg://...) before real use.
      - key: ATT_DATABASE_URL
        value: sqlite:////tmp/attendance.db
      - key: ATT_GOOGLE_CLIENT_ID
        value: 734399685844-rocm7a76g418k6scthl5s7lvhajt4km4.apps.googleusercontent.com
      - key: ATT_JWT_SECRET
        generateValue: true
      - key: ATT_INSTITUTE_DOMAIN
        value: iiitnr.edu.in
      - key: ATT_TRUST_PROXY
        value: "true"
      - key: ATT_TIMEZONE
        value: Asia/Kolkata
      # TESTING MODE. Anyone can log in as anyone via /auth/dev-token while this is "true".
      # Before real scholars use it: set ATT_DEV_MODE=false and ATT_ENFORCE_DEVICE_LOCK=true.
      - key: ATT_DEV_MODE
        value: "true"
      - key: ATT_ENFORCE_DEVICE_LOCK
        value: "false"
      - key: ATT_KIOSK_KEY
        generateValue: true
      - key: ATT_APK_URL
        value: https://github.com/cricketmagician/iiitnr-attendance/releases/latest/download/app-release.apk
