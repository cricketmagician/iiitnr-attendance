version: "3.8"

services:
  attendance-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iiitnr-attendance-api
    restart: always
    ports:
      - "8040:8040"
    environment:
      - PORT=8040
      - ATT_DATABASE_URL=sqlite:////app/data/attendance.db
      - ATT_GOOGLE_CLIENT_ID=734399685844-rocm7a76g418k6scthl5s7lvhajt4km4.apps.googleusercontent.com
      # Secrets come from the shell or a .env file next to this file (never commit them):
      #   ATT_JWT_SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
      - ATT_JWT_SECRET=${ATT_JWT_SECRET:?Set ATT_JWT_SECRET (64 random hex chars)}
      - ATT_KIOSK_KEY=${ATT_KIOSK_KEY:?Set ATT_KIOSK_KEY (random key for the guard kiosk)}
      - ATT_ENFORCE_DEVICE_LOCK=true
      - ATT_INSTITUTE_DOMAIN=iiitnr.edu.in
      - ATT_TRUST_PROXY=true
      - ATT_TIMEZONE=Asia/Kolkata
      - ATT_DEV_MODE=false
      - ATT_APK_URL=https://github.com/cricketmagician/iiitnr-attendance/releases/latest/download/app-release.apk
    volumes:
      - ./attendance_data:/app/data
      - ./attendance_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
