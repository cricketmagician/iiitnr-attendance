name: iiitnr_scholar_attendance
description: "IIIT Naya Raipur - Scholar Attendance & Leave Management App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & Cryptography
  http: ^1.2.2
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.2

  # Device & Biometrics
  device_info_plus: ^10.1.2
  android_id: ^0.4.0
  local_auth: ^2.3.0
  camera: ^0.11.0+2
  image: ^4.2.0

  # Notifications & Date Utilities
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  intl: ^0.19.0

  # Files & Sharing
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  mobile_scanner: 5.2.3
  qr_flutter: ^4.1.0
  camera_android: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
